sonar.projectKey=stefanasemota_sabi-auth-lib
sonar.organization=stefanasemota

# 1. Point to the src folder
sonar.sources=src

# 2. Define the tests folder separately
sonar.tests=src/__tests__

# 3. Path to coverage report (ensure this matches where Jest puts it)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 4. Exclusions to ignore tests, build output, and compiled JavaScript ghosts
sonar.exclusions=src/__tests__/**, dist/**, node_modules/**, src/**/*.js, src/**/*.d.ts
sonar.scanner.skipJreProvisioning=true